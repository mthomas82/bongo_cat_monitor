name: Build Mac App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  native-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native menu-bar app
        run: |
          cd bongo-cat-macos
          make

      - name: Zip BongoCat.app
        run: |
          cd bongo-cat-macos/build
          ditto -c -k --keepParent BongoCat.app BongoCat-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BongoCat-macOS
          path: bongo-cat-macos/build/BongoCat-macOS.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bongo-cat-macos/build/BongoCat-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
